<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="pitanie-host" content="standalone">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#faf6fb">
  <meta name="description" content="Личный расчёт КБЖУ, меню по выбранным продуктам, дневник питания и воды.">
  <title>Питание в балансе</title>
  <link rel="icon" href="./assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
<a class="skip" href="#main">К содержанию</a>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="#today" aria-label="Питание в балансе, главная">
      <img src="./assets/mark.svg" width="41" height="41" alt="">
      <span>Питание<br><b>в балансе</b></span>
    </a>
    <nav id="nav" class="nav" aria-label="Разделы"></nav>
    <div class="sidebar-foot">
      <div class="account-link" id="account"></div>
      <button type="button" class="quiet about-link" data-action="about">О расчётах и данных</button>
    </div>
  </aside>
  <nav id="mobile-nav" class="mobile-nav" aria-label="Основные разделы"></nav>
  <main id="main" tabindex="-1">
    <header class="topbar">
      <a class="mobile-brand" href="#today"><img src="./assets/mark.svg" width="30" height="30" alt="">Питание в балансе</a>
      <span class="top-crumb" id="crumb"></span>
      <button type="button" class="icon-button top-profile" aria-label="Открыть личный кабинет" data-nav="profile"></button>
    </header>
    <div id="view"></div>
  </main>
</div>
<dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-body"></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
